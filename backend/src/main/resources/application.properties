spring.application.name=convox-backend
server.port=${PORT:8080}

# Spring Data JPA / Hibernate Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/convox_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring Boot Security / JWT Configurations
app.jwtSecret=${JWT_SECRET:convoxSecretKeyconvoxSecretKeyconvoxSecretKeyconvoxSecretKeyconvoxSecretKey}
app.jwtExpirationInMs=604800000

# CORS settings for React integration
# Support comma-separated origins via env var
app.cors.allowedOrigins=${ALLOWED_ORIGINS:http://localhost:3000}

# Increase upload limits for Base64 images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
spring.jackson.serialization.fail-on-empty-beans=false

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:15000}
# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
